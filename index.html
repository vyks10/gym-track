<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym 2026 Cloud Tracker</title>
    <!-- Mobile PWA & Android Meta Capabilities -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <!-- Tailwind CSS Script Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                950: '#030712',
              }
            }
          }
        }
      }
    </script>
    
    <!-- React & Babel Standalone Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased select-none">

    <div id="root"></div>

    <!-- ES Modules Integration inside Babel -->
    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo } = React;

        // --- Custom SVG Icons & Micro-Interactions ---
        const CloudIcon = ({ status }) => {
          const colorMap = {
            'synced': 'text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.4)]',
            'syncing': 'text-indigo-400 animate-pulse',
            'connecting': 'text-amber-400 animate-bounce',
            'local': 'text-slate-500',
            'error': 'text-rose-400 animate-ping'
          };
          return (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" class={`w-5 h-5 transition-all ${colorMap[status] || 'text-slate-500'}`}>
              <path d="M17.5 19A3.5 3.5 0 0 0 21 15.5c0-2.79-2.54-4.5-5-4.5-.47-1.42-1.74-2.5-3.2-2.5-2.22 0-4 1.8-4 4-.1 0-.2 0-.3 0A3.5 3.5 0 0 0 5 16c0 1.93 1.57 3.5 3.5 3.5" />
              {status === 'syncing' && <path d="M12 11v4M12 15l-2-2M12 15l2-2" strokeWidth="2" />}
            </svg>
          );
        };

        const PlusIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" class="w-5 h-5"><path d="M5 12h14m-7-7v14" /></svg>);
        const MinusIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" class="w-5 h-5"><path d="M5 12h14" /></svg>);
        const TrashIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="w-4 h-4 text-rose-400"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" /></svg>);
        const DumbbellIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="w-5 h-5"><path d="m6.5 6.5 11 11M21 21l-3-3M3 3l3 3M18.5 5.5l3 3M5.5 18.5l3 3M8.5 2.5l5 5M10.5 21.5l5-5M2.5 8.5l5 5M16.5 10.5l5 5" /></svg>);
        const TrendingUpIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="w-5 h-5"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></svg>);
        const SettingsIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="w-5 h-5"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>);

        // Pre-seeded complete historical records
        const DEFAULT_EXERCISES = [
          {
            id: "leg-press", name: "Leg press", category: "Legs",
            history: [
              { date: "2025-12-11", blocks: [{ weight: 40, reps: 11, sets: 3 }], notes: "1s" },
              { date: "2026-01-08", blocks: [{ weight: 50, reps: 8, sets: 2 }, { weight: 100, reps: 8, sets: 1 }], notes: "1s" },
              { date: "2026-01-15", blocks: [{ weight: 50, reps: 8, sets: 2 }, { weight: 100, reps: 8, sets: 1 }], notes: "" },
              { date: "2026-01-22", blocks: [{ weight: 40, reps: 8, sets: 2 }, { weight: 100, reps: 8, sets: 1 }], notes: "" },
              { date: "2026-02-12", blocks: [{ weight: 40, reps: 12, sets: 2 }, { weight: 110, reps: 12, sets: 1 }], notes: "" },
              { date: "2026-02-19", blocks: [{ weight: 40, reps: 12, sets: 2 }, { weight: 110, reps: 12, sets: 1 }], notes: "" },
              { date: "2026-02-26", blocks: [{ weight: 50, reps: 8, sets: 2 }, { weight: 110, reps: 8, sets: 1 }], notes: "" },
              { date: "2026-03-05", blocks: [{ weight: 50, reps: 12, sets: 2 }, { weight: 110, reps: 12, sets: 1 }], notes: "" },
              { date: "2026-03-12", blocks: [{ weight: 60, reps: 6, sets: 2 }, { weight: 120, reps: 6, sets: 1 }], notes: "" },
              { date: "2026-03-19", blocks: [{ weight: 60, reps: 8, sets: 2 }, { weight: 120, reps: 8, sets: 1 }], notes: "" },
              { date: "2026-04-09", blocks: [{ weight: 60, reps: 10, sets: 2 }, { weight: 120, reps: 10, sets: 1 }], notes: "" },
              { date: "2026-04-16", blocks: [{ weight: 60, reps: 12, sets: 2 }, { weight: 120, reps: 12, sets: 1 }], notes: "" },
              { date: "2026-04-30", blocks: [{ weight: 60, reps: 12, sets: 2 }, { weight: 120, reps: 12, sets: 1 }], notes: "" },
              { date: "2026-05-14", blocks: [{ weight: 70, reps: 6, sets: 2 }, { weight: 140, reps: 6, sets: 1 }], notes: "" }
            ]
          },
          {
            id: "shoulder-press", name: "Shoulder Press", category: "Shoulders",
            history: [
              { date: "2025-12-11", blocks: [{ weight: 20, reps: 6, sets: 3 }], notes: "" },
              { date: "2026-01-08", blocks: [{ weight: 20, reps: 8, sets: 3 }], notes: "" },
              { date: "2026-01-22", blocks: [{ weight: 20, reps: 8, sets: 3 }], notes: "" },
              { date: "2026-02-12", blocks: [{ weight: 20, reps: 10, sets: 3 }], notes: "" },
              { date: "2026-02-19", blocks: [{ weight: 20, reps: 12, sets: 3 }], notes: "" },
              { date: "2026-02-26", blocks: [{ weight: 20, reps: 12, sets: 3 }], notes: "" },
              { date: "2026-03-05", blocks: [{ weight: 22, reps: 6, sets: 3 }], notes: "" },
              { date: "2026-03-12", blocks: [{ weight: 22, reps: 6, sets: 3 }], notes: "" },
              { date: "2026-03-18", blocks: [{ weight: 20, reps: 6, sets: 3 }], notes: "45°" },
              { date: "2026-04-09", blocks: [{ weight: 20, reps: 6, sets: 3 }], notes: "" },
              { date: "2026-04-16", blocks: [{ weight: 20, reps: 8, sets: 3 }], notes: "" },
              { date: "2026-04-30", blocks: [{ weight: 20, reps: 8, sets: 3 }], notes: "part" },
              { date: "2026-05-07", blocks: [{ weight: 20, reps: 8, sets: 3 }], notes: "full" },
              { date: "2026-05-14", blocks: [{ weight: 20, reps: 8, sets: 3 }], notes: "full" }
            ]
          },
          {
            id: "row", name: "Row", category: "Back",
            history: [
              { date: "2025-12-11", blocks: [{ weight: 34, reps: 15, sets: 3 }], notes: "" },
              { date: "2026-01-08", blocks: [{ weight: 34, reps: 12, sets: 3 }], notes: "" },
              { date: "2026-01-15", blocks: [{ weight: 34, reps: 12, sets: 3 }], notes: "" },
              { date: "2026-01-22", blocks: [{ weight: 34, reps: 12, sets: 3 }], notes: "" },
              { date: "2026-02-12", blocks: [{ weight: 40, reps: 6, sets: 3 }], notes: "" },
              { date: "2026-02-26", blocks: [{ weight: 40, reps: 12, sets: 3 }], notes: "" },
              { date: "2026-03-05", blocks: [{ weight: 44, reps: 6, sets: 3 }], notes: "" },
              { date: "2026-03-13", blocks: [{ weight: 44, reps: 8, sets: 3 }], notes: "" },
              { date: "2026-04-09", blocks: [{ weight: 44, reps: 8, sets: 3 }], notes: "" },
              { date: "2026-04-16", blocks: [{ weight: 44, reps: 8, sets: 3 }], notes: "" },
              { date: "2026-04-30", blocks: [{ weight: 42, reps: 10, sets: 3 }], notes: "" },
              { date: "2026-05-07", blocks: [{ weight: 44, reps: 10, sets: 3 }], notes: "" },
              { date: "2026-05-14", blocks: [{ weight: 44, reps: 12, sets: 3 }], notes: "part" }
            ]
          }
        ];

        function App() {
          const [exercises, setExercises] = useState(() => {
            const saved = localStorage.getItem('gym_2026_exercises');
            return saved ? JSON.parse(saved) : DEFAULT_EXERCISES;
          });

          const [activeTab, setActiveTab] = useState('exercises'); // exercises | tracking | settings
          const [focusedExerciseId, setFocusedExerciseId] = useState('leg-press');
          const [showLogModal, setShowLogModal] = useState(false);
          
          // Cloud Sync State Elements
          const [db, setDb] = useState(null);
          const [user, setUser] = useState(null);
          const [syncStatus, setSyncStatus] = useState('local'); // local | connecting | syncing | synced | error
          const [syncError, setSyncError] = useState(null);

          // Form management
          const [logForm, setLogForm] = useState({
            exerciseId: '', date: new Date().toISOString().split('T')[0],
            blocks: [{ weight: 20, reps: 8, sets: 3 }], notes: ''
          });

          // Fetch Environmental Credentials
          const firebaseConfig = useMemo(() => {
            if (typeof __firebase_config !== 'undefined') {
              return JSON.parse(__firebase_config);
            }
            const localCustom = localStorage.getItem('gym_firebase_config_custom');
            return localCustom ? JSON.parse(localCustom) : null;
          }, []);

          const appId = typeof __app_id !== 'undefined' ? __app_id : 'gym-2026-app-v2';
          const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

          // Save fallback state to local cache
          useEffect(() => {
            localStorage.setItem('gym_2026_exercises', JSON.stringify(exercises));
          }, [exercises]);

          // Firebase Init Protocol matching strict Auth Rule 3
          useEffect(() => {
            if (!firebaseConfig) {
              setSyncStatus('local');
              return;
            }

            try {
              setSyncStatus('connecting');
              const app = initializeApp(firebaseConfig);
              const auth = getAuth(app);
              const firestoreDb = getFirestore(app);
              setDb(firestoreDb);

              const runSecureAuth = async () => {
                if (initialAuthToken) {
                  await signInWithCustomToken(auth, initialAuthToken);
                } else {
                  await signInAnonymously(auth);
                }
              };

              runSecureAuth().catch(err => {
                console.warn("Retrying direct anonymous login...");
                signInAnonymously(auth);
              });

              const unsubscribe = onAuthStateChanged(auth, (loggedUser) => {
                setUser(loggedUser);
                if (loggedUser) {
                  setSyncStatus('syncing');
                } else {
                  setSyncStatus('local');
                }
              });

              return () => unsubscribe();
            } catch (err) {
              console.error("Initialization Failed:", err);
              setSyncStatus('error');
              setSyncError(err.message);
            }
          }, [firebaseConfig]);

          // Real-time Cloud Sync Engine following Path Rule 1 & Query Rule 2
          useEffect(() => {
            if (!user || !db) return;

            // Fetch list without complex filter arrays
            const userDocPath = collection(db, 'artifacts', appId, 'users', user.uid, 'exercises');

            const unsubscribe = onSnapshot(userDocPath, (snapshot) => {
              const loaded = [];
              snapshot.forEach((doc) => {
                loaded.push({ id: doc.id, ...doc.data() });
              });

              if (loaded.length > 0) {
                // Merge loaded exercises sorted by category
                setExercises(loaded);
                setSyncStatus('synced');
              } else {
                // New user / fresh space -> push existing logs to Cloud Firestore securely
                setSyncStatus('syncing');
                initializeCloudRepository(user.uid);
              }
            }, (error) => {
              console.error("Sync Failure:", error);
              setSyncStatus('error');
              setSyncError(error.message);
            });

            return () => unsubscribe();
          }, [user, db]);

          const initializeCloudRepository = async (uid) => {
            try {
              for (const ex of DEFAULT_EXERCISES) {
                const docRef = doc(db, 'artifacts', appId, 'users', uid, 'exercises', ex.id);
                await setDoc(docRef, {
                  name: ex.name,
                  category: ex.category,
                  history: ex.history
                });
              }
              setSyncStatus('synced');
            } catch (err) {
              setSyncStatus('error');
              setSyncError(err.message);
            }
          };

          const handleOpenLogModal = (exercise) => {
            const lastSession = exercise.history?.length ? exercise.history[exercise.history.length - 1] : null;
            setLogForm({
              exerciseId: exercise.id,
              date: new Date().toISOString().split('T')[0],
              blocks: lastSession ? JSON.parse(JSON.stringify(lastSession.blocks)) : [{ weight: 20, reps: 8, sets: 3 }],
              notes: ''
            });
            setShowLogModal(true);
          };

          const handleSubmitLog = async (e) => {
            e.preventDefault();

            const targetEx = exercises.find(ex => ex.id === logForm.exerciseId);
            if (!targetEx) return;

            const newHistoryItem = {
              date: logForm.date,
              blocks: logForm.blocks.map(b => ({ weight: Number(b.weight), reps: Number(b.reps), sets: Number(b.sets) })),
              notes: logForm.notes
            };

            const updatedHistory = [...targetEx.history, newHistoryItem].sort((a, b) => new Date(a.date) - new Date(b.date));
            const updatedExercise = { ...targetEx, history: updatedHistory };

            // Optimistic UI updates
            setExercises(prev => prev.map(ex => ex.id === targetEx.id ? updatedExercise : ex));
            setShowLogModal(false);

            // Cloud sync trigger (if database is connected)
            if (user && db) {
              setSyncStatus('syncing');
              try {
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'exercises', targetEx.id);
                await setDoc(docRef, {
                  name: updatedExercise.name,
                  category: updatedExercise.category,
                  history: updatedExercise.history
                });
                setSyncStatus('synced');
              } catch (err) {
                setSyncStatus('error');
                setSyncError(err.message);
              }
            }
          };

          const updateBlockValue = (index, field, value) => {
            setLogForm(prev => {
              const blocks = [...prev.blocks];
              blocks[index][field] = value;
              return { ...prev, blocks };
            });
          };

          const formatBlocks = (blocks) => blocks.map(b => `${b.weight}kg ${b.reps}x${b.sets}`).join(' + ');

          const activeExerciseData = useMemo(() => {
            return exercises.find(e => e.id === focusedExerciseId) || exercises[0];
          }, [exercises, focusedExerciseId]);

          const metrics = useMemo(() => {
            if (!activeExerciseData || !activeExerciseData.history || activeExerciseData.history.length === 0) {
              return { maxW: 0, baselineW: 0, progress: 0 };
            }
            const maxW = Math.max(...activeExerciseData.history.flatMap(h => h.blocks.map(b => b.weight)));
            const baselineW = Math.max(...activeExerciseData.history[0].blocks.map(b => b.weight));
            const progress = baselineW > 0 ? Math.round(((maxW - baselineW) / baselineW) * 100) : 0;
            return { maxW, baselineW, progress };
          }, [activeExerciseData]);

          return (
            <div class="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col justify-between shadow-2xl border-x border-slate-900 pb-20">
              
              {/* TOP BRAND HEADER */}
              <header class="p-4 bg-slate-900/60 backdrop-blur sticky top-0 border-b border-slate-800 z-40 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-600/20"><DumbbellIcon /></div>
                  <div>
                    <h1 class="text-base font-bold text-white tracking-tight">Gym 2026</h1>
                    <p class="text-[10px] text-slate-400 font-medium">Auto-prefill & Progression</p>
                  </div>
                </div>

                {/* Cloud Sync Status Pill */}
                <div class="flex items-center gap-2 bg-slate-950/60 px-3 py-1.5 rounded-full border border-slate-800 text-xs">
                  <CloudIcon status={syncStatus} />
                  <span class="text-[10px] font-bold uppercase text-slate-400">
                    {syncStatus === 'synced' && 'Cloud Synced'}
                    {syncStatus === 'syncing' && 'Syncing...'}
                    {syncStatus === 'connecting' && 'Connecting'}
                    {syncStatus === 'local' && 'Offline Storage'}
                    {syncStatus === 'error' && 'Sync Error'}
                  </span>
                </div>
              </header>

              {/* DYNAMIC SCREEN VIEWS */}
              <main class="flex-1 p-4 overflow-y-auto">
                
                {/* 1. EXERCISE LOGGER AREA */}
                {activeTab === 'exercises' && (
                  <div class="space-y-4">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 px-1">Progression Log Setup</h2>
                    {exercises.map(ex => {
                      const last = ex.history[ex.history.length - 1];
                      return (
                        <div key={ex.id} class="bg-slate-900/40 rounded-2xl border border-slate-800/80 p-4.5 space-y-4 shadow-sm hover:border-slate-700 transition">
                          <div class="flex justify-between items-start">
                            <div>
                              <h3 class="font-bold text-white text-base">{ex.name}</h3>
                              <p class="text-xs text-slate-400 font-medium mt-0.5">{ex.category}</p>
                            </div>
                            <button 
                              onClick={() => { setFocusedExerciseId(ex.id); setActiveTab('tracking'); }} 
                              class="text-[11px] text-indigo-400 hover:text-indigo-300 font-semibold flex items-center gap-1 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800"
                            >
                              Track Progress →
                            </button>
                          </div>

                          {last ? (
                            <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-900/80 space-y-1">
                              <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase tracking-wide">
                                <span>Previous Setup ({new Date(last.date).toLocaleDateString(undefined, {month:'short', day:'numeric'})})</span>
                                {last.notes && <span class="text-indigo-400 italic font-normal">"{last.notes}"</span>}
                              </div>
                              <p class="text-sm font-semibold text-slate-200">{formatBlocks(last.blocks)}</p>
                            </div>
                          ) : (
                            <p class="text-xs text-slate-500 italic bg-slate-950 p-3 rounded-xl text-center">No structural entries recorded yet.</p>
                          )}

                          <button 
                            onClick={() => handleOpenLogModal(ex)}
                            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-600/10 transition-colors"
                          >
                            Log Prefilled Progress
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* 2. ANALYTICS & VISUAL GRAPH SECTION */}
                {activeTab === 'tracking' && (
                  <div class="space-y-5">
                    
                    {/* Horizontal Selection Slider */}
                    <div class="flex gap-1.5 overflow-x-auto pb-1">
                      {exercises.map(ex => (
                        <button
                          key={ex.id}
                          onClick={() => setFocusedExerciseId(ex.id)}
                          class={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap border transition-all ${
                            activeExerciseData.id === ex.id 
                              ? 'bg-indigo-600 border-indigo-500 text-white shadow-md shadow-indigo-600/10' 
                              : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          {ex.name}
                        </button>
                      ))}
                    </div>

                    {/* Dashboard Metrics Cards */}
                    <div class="bg-slate-900/40 rounded-2xl border border-slate-800 p-4 grid grid-cols-3 gap-2">
                      <div class="text-center p-2.5 bg-slate-950/40 rounded-xl border border-slate-900">
                        <span class="text-[9px] text-slate-500 block font-bold uppercase tracking-wider mb-0.5">Baseline</span>
                        <span class="text-sm font-bold text-slate-300">{metrics.baselineW}kg</span>
                      </div>
                      <div class="text-center p-2.5 bg-slate-950/40 rounded-xl border border-slate-900">
                        <span class="text-[9px] text-slate-500 block font-bold uppercase tracking-wider mb-0.5">Peak Max</span>
                        <span class="text-sm font-bold text-indigo-400">{metrics.maxW}kg</span>
                      </div>
                      <div class="text-center p-2.5 bg-slate-950/40 rounded-xl border border-slate-900">
                        <span class="text-[9px] text-slate-500 block font-bold uppercase tracking-wider mb-0.5">Progress</span>
                        <span class="text-sm font-bold text-emerald-400">+{metrics.progress}%</span>
                      </div>
                    </div>

                    {/* RESPONSIVE SCALABLE PROGRESSION GRAPH */}
                    <div class="bg-slate-900/60 rounded-2xl border border-slate-800 p-4.5 space-y-3">
                      <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                          <TrendingUpIcon /> Performance Max Track
                        </h3>
                        <span class="text-[9px] text-indigo-400 bg-indigo-500/10 font-bold px-2 py-0.5 rounded">Weight (kg)</span>
                      </div>

                      {activeExerciseData.history && activeExerciseData.history.length > 0 ? (
                        <div class="space-y-2">
                          <div class="h-44 w-full bg-slate-950 rounded-xl p-2 border border-slate-900 flex items-end relative overflow-hidden">
                            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                              <line x1="0" y1="25" x2="100" y2="25" stroke="#1e293b" strokeWidth="0.5" strokeDasharray="3" />
                              <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="0.5" strokeDasharray="3" />
                              <line x1="0" y1="75" x2="100" y2="75" stroke="#1e293b" strokeWidth="0.5" strokeDasharray="3" />

                              {(() => {
                                const history = activeExerciseData.history;
                                const weights = history.map(h => Math.max(...h.blocks.map(b => b.weight)));
                                const minW = Math.min(...weights) - 5 < 0 ? 0 : Math.min(...weights) - 5;
                                const maxW = Math.max(...weights) + 5;
                                const range = maxW - minW || 1;

                                const points = history.map((h, i) => {
                                  const x = history.length > 1 ? (i / (history.length - 1)) * 100 : 50;
                                  const currentMax = Math.max(...h.blocks.map(b => b.weight));
                                  const y = 100 - ((currentMax - minW) / range) * 85 - 8;
                                  return { x, y };
                                });

                                const lineString = points.map(p => `${p.x},${p.y}`).join(' ');

                                return (
                                  <>
                                    <path d={`M0,100 L${points[0]?.x},${points[0]?.y} ${lineString} L100,100 Z`} fill="url(#grad)" opacity="0.1" />
                                    <polyline fill="none" stroke="rgb(99, 102, 241)" strokeWidth="2.5" points={lineString} />
                                    <defs>
                                      <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stopColor="rgb(99, 102, 241)" />
                                        <stop offset="100%" stopColor="transparent" />
                                      </linearGradient>
                                    </defs>
                                    {points.map((p, i) => (
                                      <circle key={i} cx={p.x} cy={p.y} r="3" class="fill-indigo-400 stroke-slate-950 stroke-2" />
                                    ))}
                                  </>
                                );
                              })()}
                            </svg>
                          </div>
                          <div class="flex justify-between text-[9px] font-bold text-slate-500 px-0.5">
                            <span>{new Date(activeExerciseData.history[0].date).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span>
                            <span>Timeline Progression</span>
                            <span>{new Date(activeExerciseData.history[activeExerciseData.history.length - 1].date).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span>
                          </div>
                        </div>
                      ) : (
                        <p class="text-xs text-slate-500 italic text-center py-6">Add progress sets to load graph projections.</p>
                      )}
                    </div>

                    {/* DETAILED CHRONOLOGICAL HISTORY TIMESTAMP LIST */}
                    <div class="space-y-2">
                      <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">Progression Log History</h3>
                      <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                        {[...activeExerciseData.history].reverse().map((h, i) => (
                          <div key={i} class="bg-slate-900/40 border border-slate-800/60 p-3 rounded-xl flex justify-between items-center">
                            <div>
                              <p class="text-xs text-indigo-400 font-bold">
                                {new Date(h.date).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: '2-digit'})}
                              </p>
                              <p class="text-sm font-semibold text-white mt-0.5">{formatBlocks(h.blocks)}</p>
                            </div>
                            {h.notes && (
                              <span class="text-[10px] bg-slate-950 border border-slate-800 text-slate-400 px-2 py-0.5 rounded italic">
                                {h.notes}
                              </span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                )}

                {/* 3. DATABASE CONFIG & STORAGE TUNING */}
                {activeTab === 'settings' && (
                  <div class="space-y-4">
                    <div class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl space-y-2.5">
                      <h3 class="text-sm font-bold text-white">Cloud Synced Profile</h3>
                      <p class="text-xs text-slate-400 leading-relaxed">
                        Your exercises and custom logs sync seamlessly using direct Google Cloud Firestore pathways.
                      </p>
                      
                      {user ? (
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-900 text-xs font-mono break-all text-slate-300">
                          <span class="text-[9px] text-slate-500 font-bold block uppercase mb-1">Authenticated UID</span>
                          {user.uid}
                        </div>
                      ) : (
                        <div class="text-xs text-amber-400 bg-amber-500/10 p-3 rounded-xl border border-amber-500/20">
                          Local only database operational. Provide custom config database keys to trigger real-time replication.
                        </div>
                      )}
                    </div>

                    <div class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl space-y-3">
                      <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Add Custom Firestore Database (Optional)</h4>
                      <p class="text-[11px] text-slate-500">Paste your custom database client parameters configuration JSON below to direct sync to your private servers:</p>
                      <textarea 
                        id="custom_fb_input"
                        placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", "storageBucket": "..."}'
                        class="w-full h-24 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 font-mono focus:outline-none focus:border-indigo-500 placeholder-slate-700"
                      />
                      <button 
                        onClick={() => {
                          const val = document.getElementById('custom_fb_input').value;
                          try {
                            JSON.parse(val);
                            localStorage.setItem('gym_firebase_config_custom', val);
                            alert("Database Configuration Saved! Reloading...");
                            location.reload();
                          } catch (err) {
                            alert("Invalid JSON format. Check parameters.");
                          }
                        }}
                        class="w-full bg-slate-800 hover:bg-slate-750 text-white font-bold py-2 rounded-xl text-xs transition"
                      >
                        Save Personal Cloud Keys
                      </button>
                    </div>

                    <button 
                      onClick={() => { if(confirm("Permanently clear cache and reset tracker database?")) { localStorage.clear(); location.reload(); } }}
                      class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 py-3 rounded-xl text-xs font-bold transition-colors"
                    >
                      Reset Local Cache & Storage
                    </button>
                  </div>
                )}

              </main>

              {/* BOTTOM NAVIGATION NAV */}
              <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/90 backdrop-blur border-t border-slate-800 p-3 flex justify-around items-center z-50">
                <button 
                  onClick={() => setActiveTab('exercises')} 
                  class={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'exercises' ? 'text-indigo-400' : 'text-slate-400'}`}
                >
                  <DumbbellIcon /><span class="text-[9px] font-bold tracking-wide">Workouts</span>
                </button>
                <button 
                  onClick={() => setActiveTab('tracking')} 
                  class={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'tracking' ? 'text-indigo-400' : 'text-slate-400'}`}
                >
                  <TrendingUpIcon /><span class="text-[9px] font-bold tracking-wide">Tracking</span>
                </button>
                <button 
                  onClick={() => setActiveTab('settings')} 
                  class={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'settings' ? 'text-indigo-400' : 'text-slate-400'}`}
                >
                  <SettingsIcon /><span class="text-[9px] font-bold tracking-wide">Database</span>
                </button>
              </nav>

              {/* LOG PRE-FILLED SESSIONS MODAL */}
              {showLogModal && (
                <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                  <form onSubmit={handleSubmitLog} class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
                    <div class="space-y-0.5">
                      <h3 class="font-bold text-white text-base">Record Progression</h3>
                      <p class="text-xs text-slate-400 font-medium">{exercises.find(e => e.id === logForm.exerciseId)?.name}</p>
                    </div>

                    {logForm.blocks.map((b, idx) => (
                      <div key={idx} class="space-y-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <span class="text-[9px] uppercase font-bold text-indigo-400 tracking-wider">Set Configuration #{idx+1}</span>
                        <div class="grid grid-cols-3 gap-2">
                          <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wide block mb-1">Weight</label>
                            <input type="number" step="2.5" value={b.weight} onChange={e => updateBlockValue(idx, 'weight', Number(e.target.value))} class="w-full bg-slate-900 text-center border border-slate-700 font-semibold text-white rounded p-1.5 text-xs focus:outline-none focus:border-indigo-500" />
                          </div>
                          <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wide block mb-1">Reps</label>
                            <input type="number" value={b.reps} onChange={e => updateBlockValue(idx, 'reps', Number(e.target.value))} class="w-full bg-slate-900 text-center border border-slate-700 font-semibold text-white rounded p-1.5 text-xs focus:outline-none focus:border-indigo-500" />
                          </div>
                          <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wide block mb-1">Sets</label>
                            <input type="number" value={b.sets} onChange={e => updateBlockValue(idx, 'sets', Number(e.target.value))} class="w-full bg-slate-900 text-center border border-slate-700 font-semibold text-white rounded p-1.5 text-xs focus:outline-none focus:border-indigo-500" />
                          </div>
                        </div>
                      </div>
                    ))}

                    <div>
                      <label class="text-xs font-bold text-slate-400 block mb-1">Notes Track</label>
                      <input type="text" value={logForm.notes} onChange={e => setLogForm(p => ({ ...p, notes: e.target.value }))} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500" placeholder="e.g. 1s, full depth, clean sets" />
                    </div>

                    <div class="flex gap-2 pt-1">
                      <button type="button" onClick={() => setShowLogModal(false)} class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-bold transition-colors">Cancel</button>
                      <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/20 transition-colors">Save Set</button>
                    </div>
                  </form>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
